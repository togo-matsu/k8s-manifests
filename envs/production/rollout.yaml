apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: echo-app
  namespace: production
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: { duration: 5m }
      - setWeight: 50
      - pause: { duration: 2m }
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      containers:
      - name: echo-app
        image: ghcr.io/togo-matsu/echo-app:latest
        ports:
        - containerPort: 8080
        env:
          - name: OTEL_SERVICE_NAME
            value: "echo-app-prod"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "deployment.environment=production"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"

---
apiVersion: v1
kind: Service
metadata:
  name: echo-app-svc
  namespace: production
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo-app
