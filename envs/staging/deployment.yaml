apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-app
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret  # ← ここを追加
      containers:
      - name: echo-app
        image: ghcr.io/togo-matsu/echo-app:latest
        args:
          - "-text=Hello from Kubernetes!"  # アプリが求めているテキスト引数を指定
        ports:
          - containerPort: 8080
        env:
          - name: OTEL_SERVICE_NAME
            value: "echo-app-staging"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "deployment.environment=staging"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"
