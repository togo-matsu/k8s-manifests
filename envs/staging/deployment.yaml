apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-app
  namespace: staging
  labels:
    app: echo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      containers:
      - name: echo-app
        image: ghcr.io/<your-org>/echo-app:latest # 初期値、または直近のタグ
        ports:
        - containerPort: 8080
