apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-app
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret  # ← ここを追加
      containers:
      - name: echo-app
        image: ghcr.io/togo-matsu/echo-app:b5ff544
        ports:
        - containerPort: 8080
