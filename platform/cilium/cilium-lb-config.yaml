apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "blue-pool"
  namespace: kube-system
spec:
  blocks:
  - cidr: "10.0.0.200/32"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "policy1"
  namespace: kube-system
spec:
  nodeSelector:
    matchExpressions:
    - key: kubernetes.io/os
      operator: In
      values:
      - linux
  interfaces:
  - eth0
  externalIPs: true
  loadBalancerIPs: true
