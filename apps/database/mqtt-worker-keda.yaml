apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mqtt-worker-scaler
  namespace: mqtt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mqtt-worker
  pollingInterval: 15      # 15秒ごとにメトリクスを監視
  cooldownPeriod: 60       # メッセージが途絶えてから0台に縮退するまでの待機時間（秒）
  minReplicaCount: 0       # メッセージがない時は 0 台（Scale-to-Zero）
  maxReplicaCount: 5       # 高負荷時の最大 Pod 数
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
  - type: prometheus
    metadata:
      # Prometheus への内部アクセスURL
      serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      metricName: emqx_messages_received_rate
      # 直近1分間のメッセージ受信レート（秒間1メッセージ以上でスケールアウト）
      query: sum(rate(emqx_messages_received_at[1m])) or on() vector(0)
      threshold: '1'
