apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mqtt
type: Opaque
stringData:
  POSTGRES_USER: "mqtt_user"
  POSTGRES_PASSWORD: "mqtt_password"
  POSTGRES_DB: "iot_data"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: mqtt
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS telemetry (
        id SERIAL PRIMARY KEY,
        device_id VARCHAR(64) NOT NULL,
        topic VARCHAR(255) NOT NULL,
        payload JSONB NOT NULL,
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_telemetry_device_id ON telemetry(device_id);
    CREATE INDEX IF NOT EXISTS idx_telemetry_created_at ON telemetry(created_at DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate  # 古いPodを停止してから新しいPodを起動する
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        # lost+found 衝突回避のためサブディレクトリを指定
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: init-sql
        configMap:
          name: postgres-init-script
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: mqtt
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
