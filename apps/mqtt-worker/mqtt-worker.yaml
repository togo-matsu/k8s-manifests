apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-worker-script
  namespace: mqtt
data:
  worker.py: |
    import json
    import os
    import sys
    import paho.mqtt.client as mqtt
    import psycopg2
    from psycopg2.extras import Json

    BROKER_HOST = os.getenv("MQTT_BROKER", "emqx-service.mqtt.svc.cluster.local")
    BROKER_PORT = int(os.getenv("MQTT_PORT", "1883"))
    TOPIC = "devices/+/telemetry"

    DB_HOST = os.getenv("DB_HOST", "postgres-service.mqtt.svc.cluster.local")
    DB_PORT = os.getenv("DB_PORT", "5432")
    DB_NAME = os.getenv("DB_NAME", "iot_data")
    DB_USER = os.getenv("DB_USER", "mqtt_user")
    DB_PASS = os.getenv("DB_PASS", "mqtt_password")

    def get_db_connection():
        return psycopg2.connect(
            host=DB_HOST,
            port=DB_PORT,
            dbname=DB_NAME,
            user=DB_USER,
            password=DB_PASS
        )

    def on_connect(client, userdata, flags, rc, properties=None):
        if rc == 0:
            print(f"[Worker] Connected to MQTT Broker. Subscribing to: {TOPIC}", flush=True)
            client.subscribe(TOPIC)
        else:
            print(f"[Worker] Connection failed with code {rc}", flush=True)

    def on_message(client, userdata, msg):
        topic = msg.topic
        payload_str = msg.payload.decode('utf-8')
        parts = topic.split('/')
        device_id = parts[1] if len(parts) >= 2 else "unknown"

        print(f"[Worker] Received from {device_id} on {topic}", flush=True)

        try:
            data = json.loads(payload_str)
            # PostgreSQL へ保存
            conn = get_db_connection()
            cur = conn.cursor()
            cur.execute(
                "INSERT INTO telemetry (device_id, topic, payload) VALUES (%s, %s, %s);",
                (device_id, topic, Json(data))
            )
            conn.commit()
            cur.close()
            conn.close()
            print(f"  -> Successfully saved to PostgreSQL! Data: {data}", flush=True)
        except json.JSONDecodeError:
            print(f"  -> [Warning] Failed to parse JSON: {payload_str}", flush=True)
        except Exception as e:
            print(f"  -> [Error] DB Insert failed: {e}", flush=True)

    client = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2)
    client.on_connect = on_connect
    client.on_message = on_message

    print(f"[Worker] Connecting to {BROKER_HOST}:{BROKER_PORT}...", flush=True)
    client.connect(BROKER_HOST, BROKER_PORT, 60)
    client.loop_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-worker
  namespace: mqtt
  labels:
    app: mqtt-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-worker
  template:
    metadata:
      labels:
        app: mqtt-worker
    spec:
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir paho-mqtt psycopg2-binary && python /app/worker.py
        env:
        - name: MQTT_BROKER
          value: "emqx-service.mqtt.svc.cluster.local"
        - name: MQTT_PORT
          value: "1883"
        - name: DB_HOST
          value: "postgres-service.mqtt.svc.cluster.local"
        - name: DB_NAME
          value: "iot_data"
        - name: DB_USER
          value: "mqtt_user"
        - name: DB_PASS
          value: "mqtt_password"
        volumeMounts:
        - name: script-volume
          mountPath: /app
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: script-volume
        configMap:
          name: mqtt-worker-script
