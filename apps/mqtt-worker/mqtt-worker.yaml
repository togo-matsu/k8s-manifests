apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-worker
  namespace: mqtt
  labels:
    app: mqtt-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-worker
  template:
    metadata:
      labels:
        app: mqtt-worker
    spec:
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir \
              paho-mqtt \
              psycopg2-binary \
              opentelemetry-api \
              opentelemetry-sdk \
              opentelemetry-exporter-otlp-proto-grpc && \
            python /app/worker.py
        env:
        - name: MQTT_BROKER
          value: "emqx-service.mqtt.svc.cluster.local"
        - name: MQTT_PORT
          value: "1883"
        - name: DB_HOST
          value: "postgres-service.mqtt.svc.cluster.local"
        - name: DB_NAME
          value: "iot_data"
        - name: DB_USER
          value: "mqtt_user"
        - name: DB_PASS
          value: "mqtt_password"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
        volumeMounts:
        - name: script-volume
          mountPath: /app
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      volumes:
      - name: script-volume
        configMap:
          name: mqtt-worker-script
