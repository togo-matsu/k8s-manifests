# k8s-manifests/.github/workflows/update-tag.yaml の例
name: Update Image Tags

on:
  repository_dispatch:
    types: [update-image-tag]

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 1. ステージング環境のタグは自動書き換え ＆ そのまま main ブランチへコミット
      - name: Update Staging Deployment
        run: |
          NEW_TAG="${{ github.event.client_payload.image_tag }}"
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository_owner }}/echo-app:${NEW_TAG}|g" envs/staging/deployment.yaml
          git add envs/staging/deployment.yaml
          git commit -m "chore(staging): update echo-app tag to ${NEW_TAG}" || echo "No changes to commit"
          git push

      # 2. 本番環境のタグは別ブランチを切って PR を作成（安全性確保）
      - name: Create Production PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "update-prod-${{ github.event.client_payload.image_tag }}"
          commit-message: "chore(production): update echo-app tag to ${{ github.event.client_payload.image_tag }}"
          title: "【本番リリース】echo-app タグ更新 -> ${{ github.event.client_payload.image_tag }}"
          body: "ステージングでの動作確認完了を前提とした、本番環境（Argo Rollouts）へのカナリアデプロイ用PRです。"
          add-paths: envs/production/rollout.yaml
