jobs:
  # -------------------------------------------------------------
  # Job 1: コードチェック & ユニットテスト (Lint & Test)
  # -------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Hadolint による Dockerfile の静的解析（コードチェック）
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./apps/echo-app/Dockerfile

      # 2. 簡易テスト（例: Dockerfile の構造や依存関係の検証）
      - name: Run Unit Test
        run: |
          echo "=== ユニットテストを実行中 ==="
          if [ -f ./apps/echo-app/Dockerfile ]; then
            echo "SUCCESS: Dockerfile が存在することを確認しました。"
          else
            echo "ERROR: Dockerfile が見つかりません。" && exit 1
          fi

  # -------------------------------------------------------------
  # Job 2: イメージビルド & GHCR プッシュ (Build & Push)
  # -------------------------------------------------------------
  build-and-push:
    needs: lint-and-test # ← テスト(Job 1)が成功した場合のみ実行される
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/echo-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
